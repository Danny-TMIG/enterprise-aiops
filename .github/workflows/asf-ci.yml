name: ASF CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Validate catalog and manifest
        run: |
          python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('catalog').glob('*.json')]"
      - name: Compute affected components
        run: python tooling/ci/affected.py origin/${{ github.base_ref || 'main' }}
      - name: Run affected component tests
        run: python tooling/ci/run_affected.py
      - name: Upload affected.json
        uses: actions/upload-artifact@v4
        with:
          name: affected
          path: affected.json
