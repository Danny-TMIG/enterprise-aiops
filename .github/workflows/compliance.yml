name: Sovereign Infrastructure Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-spine:
    name: Execution Matrix Verification Pass
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Sovereign Infrastructure Core
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Initialize Deterministic Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Hardened Production Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov coverage

    - name: Flush Dynamic Runtime Compilation Caches
      run: |
        find dcs/ -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
        find dcs/ -name "*.pyc" -delete 2>/dev/null || true

    - name: Execute Parallel Difference Engine Matrix Pass
      run: |
        pytest dcs/tests/test_behavior_math.py \
               dcs/tests/test_bisim.py \
               dcs/tests/test_full_coverage.py \
               dcs/tests/test_sdlc_integration.py \
               --cov=dcs \
               --cov-config=.coveragerc \
               -v

    - name: Validate 100% Comprehensive Coverage Gate
      run: |
        python discover_coverage.py

    - name: Attest Master Manifest Registry Lineage
      run: |
        python3 -c "
        import json
        from pathlib import Path
        p = Path("dcs/standards/sdlc.json")
        if p.exists():
            with open(p, "r") as f:
                data = json.load(f)
            procs = data.get("requirements", data.get("processes", []))
            print(f"Verified Lineage for {len(procs)} SDLC Compliance Processes Natively.")
        else:
            print("Warning: Master Manifest file location is shifted.")
        "
