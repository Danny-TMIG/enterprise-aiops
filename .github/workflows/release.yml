name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist --wheel
      - name: Compute subject hashes
        id: hash
        working-directory: dist
        run: echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  attach:
    needs: [provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  verify:
    needs: [attach]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: slsa-framework/slsa-verifier/actions/installer@v2.6.0
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets
          ls -la release-assets
      - name: Verify every built artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release-assets/*.whl release-assets/*.tar.gz)
          [ ${#artifacts[@]} -gt 0 ] || { echo "no artifacts"; exit 1; }
          prov=release-assets/multiple.intoto.jsonl
          [ -f "$prov" ] || { echo "no provenance"; exit 1; }
          for f in "${artifacts[@]}"; do
            echo "== verifying $f =="
            slsa-verifier verify-artifact "$f" \
              --provenance-path "$prov" \
              --source-uri "github.com/${GITHUB_REPOSITORY}"
          done
