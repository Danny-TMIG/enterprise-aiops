name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Compute subject hashes
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload dist as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach dist to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "Release ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  verify:
    needs: [provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: slsa-framework/slsa-verifier/actions/installer@v2.6.0

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets
          ls -la release-assets

      - name: Verify every built artifact against the provenance
        run: |
          set -euo pipefail
          provenance=release-assets/multiple.intoto.jsonl
          [ -f "$provenance" ] || { echo "provenance missing"; exit 1; }

          shopt -s nullglob
          artifacts=(release-assets/*.whl release-assets/*.tar.gz)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "no artifacts found in release-assets"; exit 1
          fi

          for f in "${artifacts[@]}"; do
            echo "== verifying $f =="
            slsa-verifier verify-artifact "$f" \
              --provenance-path "$provenance" \
              --source-uri "github.com/${GITHUB_REPOSITORY}"
          done
