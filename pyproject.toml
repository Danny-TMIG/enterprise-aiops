[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops_platform_metadusa_cell"
version = "1.0.0"
description = "A sovereign AIOps engine processing system telemetry natively in RAM"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name="Danny", email="metadusa@dannys-macbook.internal" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
observability = [
    "structlog>=24.1",
]

[tool.ruff]
line-length = 100
exclude = [
    ".venv", ".venv312", ".lanes",
    "constructors", "sovereign-bounded-matrix",
    ".spec-fix-backups", "docs/site_output", "logs",
]

[tool.ruff.lint]
ignore = [
    "E402",
    "E731",
    "E741",
    "F403",
    "F405",
    "F841",
]
