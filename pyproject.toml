[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "aether-core"
version = "1.2.0"
description = "The Mark Intelligence Group - Sovereign Local AI Infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["components", "libraries", "ucs"]
