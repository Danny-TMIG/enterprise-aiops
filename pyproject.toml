[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs-conformance"
version = "1.0.0"
description = "Belnap-folded conformance: OSCAL + in-toto bundles from any source"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Danny", email = "danny@dannylabs.example" }]
keywords = [
    "compliance", "conformance", "oscal", "in-toto", "sigstore",
    "belnap", "paraconsistent", "audit", "soc2", "fedramp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.28"]
oscap = ["xmltodict>=0.13"]
crypto = ["cryptography>=41"]
dev = [
    "ruff>=0.6", "mypy>=1.10", "pytest>=7.4",
    "pytest-cov>=5", "cryptography>=41", "boto3>=1.28",
]

[project.scripts]
dcs = "dcs.cli:main"

[project.urls]
Homepage = "https://github.com/Danny-TMIG/enterprise-aiops"
Repository = "https://github.com/Danny-TMIG/enterprise-aiops"
Issues = "https://github.com/Danny-TMIG/enterprise-aiops/issues"

[tool.setuptools.packages.find]
include = ["dcs*"]
exclude = ["tests*", "app*", ".venv*", ".lanes*"]

[tool.setuptools.package-data]
dcs = ["standards/*.json"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0 -v"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["app/generated/*", "app/dispatchpatch/*"]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __debug__:",
    "if 0:",
    "if __name__ == '__main__':",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "PT"]
ignore = [
    "S101",
    "B007", "B905",
    "E731", "E741",
    "N802", "N803", "N805", "N806", "N812",
    "PT011", "PT017", "PT018",
    "S102", "S108", "S307", "S311", "S603", "S607", "S608",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["dcs"]
mypy_path = "."
namespace_packages = false
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dcs.nature.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "app.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "dcs._cli_orig"
ignore_errors = true
