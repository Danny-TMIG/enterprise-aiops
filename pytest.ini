[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    -p no:cacheprovider
markers =
    slow: takes more than 1s
    integration: touches filesystem, network, or subprocess
    security: security-relevant
    evidence: produces an evidence record
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
log_cli = false
log_cli_level = WARNING
