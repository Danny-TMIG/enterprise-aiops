[pytest]
minversion = 9.0
testpaths = dcs/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    -p no:cacheprovider

markers =
    slow: takes more than 1s
    integration: touches filesystem, network, or subprocess
    security: security-relevant
    evidence: produces an evidence record
    benchmark: performance benchmark
    property: hypothesis property test
    flaky: known-flaky, retried

filterwarnings =
    error
    ignore::DeprecationWarning:pluggy.*
    ignore::DeprecationWarning:_pytest.*
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

log_cli = false
log_cli_level = WARNING
xfail_strict = true
asyncio_mode = strict
