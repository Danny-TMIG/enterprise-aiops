$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://aether.local/schemas/capabilities.schema.yaml"
title: CapabilityContracts
description: |
  Contracts for every component family. status=declared until implemented;
  evidence list is empty by default.
type: object
required: [schema, capabilities]
additionalProperties: false
properties:
  schema:
    type: string
    const: "aether.capabilities.v1"
  note:
    type: string
  capabilities:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, family_id, group, name, inputs, limits, permissions,
                 evidence_required, implementation]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^cap\\.[a-z]+\\.[0-9]{3}\\.[a-z0-9_]+$"
        family_id:
          type: integer
          minimum: 1
        group:
          type: string
          enum:
            - hardware
            - system
            - program
            - toolchain
            - application
            - security
            - lifecycle
            - specialized
        name:
          type: string
          minLength: 1
        inputs:
          type: array
          items: { type: string }
        limits:
          type: object
          required: [max_concurrency, max_seconds]
          additionalProperties: false
          properties:
            max_concurrency:
              type: integer
              minimum: 1
            max_seconds:
              type: integer
              minimum: 1
        permissions:
          type: array
          items: { type: string }
        evidence_required:
          type: array
          items: { type: string }
        implementation:
          type: object
          required: [status]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [declared, partial, complete, deprecated]
            module:
              type: [string, "null"]
            entrypoint:
              type: [string, "null"]
        includes:
          type: array
          items: { type: string }
